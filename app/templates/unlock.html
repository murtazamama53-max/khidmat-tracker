<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Locked — Murtaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card panel">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <div class="name">MURTAZA</div>
          <div class="tagline">Khidmat Earnings Tracker</div>
        </div>
      </div>
      <div class="auth-title">App Locked</div>
      <p class="auth-subtitle">Enter your PIN to continue. Your data is safe and untouched.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
          <label for="pin">PIN</label>
          <input type="password" inputmode="numeric" pattern="[0-9]*" id="pin" name="pin" required autofocus autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Unlock</button>
      </form>

      <p style="text-align:center; margin-top:18px; font-size:12.5px; color:var(--text-muted);">
        <a href="{{ url_for('auth.logout') }}" style="color:var(--accent-cyan)">Log out instead</a>
      </p>
    </div>
  </div>
</body>
</html>
