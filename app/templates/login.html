<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Murtaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card panel">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <div class="name">MURTAZA</div>
          <div class="tagline">Khidmat Earnings Tracker</div>
        </div>
      </div>
      <div class="auth-title">Assalamu Alaikum</div>
      <p class="auth-subtitle">Log in to your private earnings dashboard.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autofocus />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p style="text-align:center; margin-top:18px; font-size:12.5px; color:var(--text-muted);">
        Just want to try the calculator? <a href="{{ url_for('guest.workspace') }}" style="color:var(--accent-cyan)">Enter Guest Workspace</a>
      </p>
    </div>
  </div>
</body>
</html>
