<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Guest Workspace — Murtaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="main" style="max-width:640px; margin:0 auto; padding-top:48px;">
    <div class="guest-banner">GUEST WORKSPACE — NOTHING IS SAVED</div>

    <div class="panel">
      <div class="panel-title">Try the calculator</div>
      <p class="panel-subtitle">Type a session and an hourly rate to see the exact calculation. This never touches anyone's saved data and disappears when you close this tab.</p>

      <div class="form-row">
        <label for="g-text">Session</label>
        <input type="text" id="g-text" placeholder="Sbhs(7) & sghs(5-6:20)" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="g-rate">Assumed hourly rate</label>
        <input type="number" id="g-rate" step="0.01" min="0.01" placeholder="e.g. 250">
      </div>

      <button class="btn btn-primary btn-block" onclick="guestCalculate()">Calculate</button>

      <div id="g-error" class="flash flash-error" style="display:none; margin-top:14px;"></div>
      <div id="g-preview" style="margin-top:14px;"></div>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:12.5px; color:var(--text-muted);">
      <a href="{{ url_for('auth.login') }}" style="color:var(--accent-cyan)">Log in as owner</a> to save real history.
    </p>
  </div>

  <script src="{{ url_for('static', filename='js/guest.js') }}"></script>
</body>
</html>
