<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set up your owner account — Murtaza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card panel">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <div class="name">MURTAZA</div>
          <div class="tagline">Khidmat Earnings Tracker</div>
        </div>
      </div>
      <div class="auth-title">Create your owner account</div>
      <p class="auth-subtitle">This is a one-time setup. Only one owner account can exist.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
          <label for="name">Display name</label>
          <input type="text" id="name" name="name" placeholder="Murtaza" />
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-row">
          <label for="password">Password (min. 8 characters)</label>
          <input type="password" id="password" name="password" required minlength="8" />
        </div>
        <div class="form-row">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
  </div>
</body>
</html>
